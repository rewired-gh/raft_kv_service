syntax = "proto3";

package raft.peer.v1;

service RaftPeer {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc ForwardCommand(ForwardCommandRequest) returns (ForwardCommandResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message RpcIdentity {
  bytes cluster_id = 1;
  uint64 sender_id = 2;
  uint64 recipient_id = 3;
  uint32 protocol_version = 4;
  uint64 term = 5;
}

message LogPosition {
  uint64 index = 1;
  uint64 term = 2;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  oneof payload {
    bool noop = 3;
    bytes command = 4;
  }
}

message RequestVoteRequest {
  RpcIdentity identity = 1;
  uint64 candidate_id = 2;
  LogPosition last_log = 3;
}

message RequestVoteResponse {
  RpcIdentity identity = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  RpcIdentity identity = 1;
  uint64 leader_id = 2;
  LogPosition previous = 3;
  repeated LogEntry entries = 4;
  uint64 leader_commit = 5;
}

message AppendEntriesResponse {
  RpcIdentity identity = 1;
  bool accepted = 2;
  uint64 match_index = 3;
  uint64 request_previous_index = 4;
}

message ForwardCommandRequest {
  RpcIdentity identity = 1;
  bytes command = 2;
  uint32 hop_count = 3;
}

message ForwardCommandResponse {
  RpcIdentity identity = 1;
  bytes result = 2;
}

message InstallSnapshotRequest {
  RpcIdentity identity = 1;
  uint32 format_version = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  repeated uint64 voter_ids = 5;
  bytes snapshot_id = 6;
  uint64 offset = 7;
  uint64 total_size = 8;
  bytes chunk = 9;
  bool done = 10;
  bytes sha256 = 11;
}

message InstallSnapshotResponse {
  RpcIdentity identity = 1;
  bytes snapshot_id = 2;
  uint64 next_offset = 3;
  bool installed = 4;
}
