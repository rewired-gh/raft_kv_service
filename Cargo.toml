[package]
name = "raft-kv-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Production-shaped foundation for a Raft-backed key-value microservice"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "limit", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.25.0"

[dev-dependencies]
serde_json = "1.0.151"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
