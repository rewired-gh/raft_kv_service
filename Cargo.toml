[package]
name = "raft-kv-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Production-shaped foundation for a Raft-backed key-value microservice"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
fastrand = "2.5.0"
prost = "0.14.4"
prometheus-client = "0.25.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
tonic-prost = "0.14.6"
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "limit", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.25.0", features = ["serde"] }

[dev-dependencies]
proptest = "1.11.0"
rcgen = "0.14.9"
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
