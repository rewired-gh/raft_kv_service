openapi: 3.1.0
info:
  title: Raft KV Service
  version: 0.1.0
  description: >-
    Linearizable CRUD API for one Raft-replicated key-value namespace. A
    timeout does not prove that a mutation failed; retry ambiguous mutations
    with the same client ID, sequence, precondition, key, and body.
servers:
  - url: http://localhost:8080
    description: Client API (TLS is required outside isolated local development)
  - url: https://localhost:8088
    description: Operational API (mTLS and bearer token required)
paths:
  /operational/v1/status:
    get:
      operationId: getNodeStatus
      summary: Inspect local Raft, membership, replication, queue, and format state
      security: [{ OperationalMtls: [], OperationalBearer: [] }]
      responses:
        '200':
          description: Local node diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /metrics:
    get:
      operationId: getMetrics
      summary: Read bounded-label OpenMetrics diagnostics
      security: [{ OperationalMtls: [], OperationalBearer: [] }]
      responses:
        '200':
          description: OpenMetrics text exposition
          content:
            application/openmetrics-text:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /operational/v1/leadership-transfer:
    post:
      operationId: transferLeadership
      summary: Move leadership to a caught-up active voter
      description: >-
        The current leader first reaches a quiescent commit/apply boundary,
        fences new proposals, catches the target up, and sends TimeoutNow.
        A 200 response means the target was subsequently observed as leader;
        timeout or loss of leadership never reports success.
      security: [{ OperationalMtls: [], OperationalBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadershipTransferRequest' }
      responses:
        '200':
          description: Target observed as the new leader
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadershipTransferResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/LeadershipTransferBusy' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/LeadershipTransferTimeout' }
  /operational/v1/membership:
    get:
      operationId: getCommittedMembership
      summary: Read the committed cluster configuration through the leader
      security: [{ OperationalMtls: [], OperationalBearer: [] }]
      responses:
        '200':
          description: Committed membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: changeMembership
      summary: Commit an exact target configuration using joint consensus
      description: >-
        The operation ID and exact target are idempotent. Reusing an operation
        ID with another target is a conflict. Success is returned only after
        the final stable configuration commits and is durably applied.
      security: [{ OperationalMtls: [], OperationalBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipRequest' }
      responses:
        '200':
          description: Stable membership committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/MembershipConflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/keys/{key}:
    parameters:
      - $ref: '#/components/parameters/Key'
    get:
      operationId: readKey
      summary: Perform a logged linearizable read
      responses:
        '200':
          description: Key found
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Raft-KV-Revision: { $ref: '#/components/headers/Revision' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: base64 }
        '404': { $ref: '#/components/responses/KeyNotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: putKey
      summary: Conditionally create or update a key
      description: >-
        If-None-Match: * selects Create. If-Match: * or an exact strong
        revision ETag selects Update. Exactly one condition is required.
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/RequestSequence'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentEncoding: base64, maxLength: 1048576 }
      responses:
        '201':
          description: Key created
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: '#/components/headers/ETag' }
            Raft-KV-Revision: { $ref: '#/components/headers/Revision' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
        '204':
          description: Key updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Raft-KV-Revision: { $ref: '#/components/headers/Revision' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/SequenceConflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/ValueTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: deleteKey
      summary: Conditionally delete a key
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/RequestSequence'
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '204':
          description: Key deleted
          headers:
            Raft-KV-Revision: { $ref: '#/components/headers/Revision' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/SequenceConflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    OperationalMtls:
      type: mutualTLS
    OperationalBearer:
      type: http
      scheme: bearer
  parameters:
    Key:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._~-]+$' }
    ClientId:
      name: Raft-KV-Client-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    RequestSequence:
      name: Raft-KV-Request-Sequence
      in: header
      required: true
      schema: { type: integer, format: uint64, minimum: 1 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string, const: '*' }
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string, pattern: '^(\*|"rev-[1-9][0-9]*")$' }
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^(\*|"rev-[1-9][0-9]*")$' }
  headers:
    ETag:
      schema: { type: string, pattern: '^"rev-[1-9][0-9]*"$' }
    Revision:
      schema: { type: integer, format: uint64, minimum: 1 }
    RequestId:
      schema: { type: string }
    CacheControl:
      schema: { type: string, const: no-store }
  schemas:
    Member:
      type: object
      additionalProperties: false
      required: [node_id, peer_endpoint]
      properties:
        node_id: { type: integer, format: uint64, minimum: 1 }
        peer_endpoint: { type: string, format: uri, maxLength: 2048 }
    MembershipRequest:
      type: object
      additionalProperties: false
      required: [operation_id, members]
      properties:
        operation_id: { type: string, format: uuid }
        members:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Member' }
    Membership:
      allOf:
        - $ref: '#/components/schemas/MembershipRequest'
        - type: object
          required: [commit_index]
          properties:
            commit_index: { type: integer, format: uint64, minimum: 1 }
    LeadershipTransferRequest:
      type: object
      additionalProperties: false
      required: [target_node_id]
      properties:
        target_node_id: { type: integer, format: uint64, minimum: 1 }
    LeadershipTransferResult:
      type: object
      additionalProperties: false
      required: [target_node_id, term]
      properties:
        target_node_id: { type: integer, format: uint64, minimum: 1 }
        term: { type: integer, format: uint64, minimum: 1 }
    Configuration:
      type: object
      additionalProperties: false
      required: [phase, operation_id, old, new]
      properties:
        phase: { type: string, enum: [stable, joint] }
        operation_id: { type: string, format: uuid }
        old: { type: array, items: { $ref: '#/components/schemas/Member' } }
        new: { type: array, items: { $ref: '#/components/schemas/Member' } }
    ReplicationProgress:
      type: object
      additionalProperties: false
      required: [node_id, next_index, match_index]
      properties:
        node_id: { type: integer, format: uint64, minimum: 1 }
        next_index: { type: integer, format: uint64, minimum: 1 }
        match_index: { type: integer, format: uint64, minimum: 0 }
    NodeStatus:
      type: object
      additionalProperties: false
      required: [cluster_id, node_id, role, term, leader_id, leadership_transfer_target_id, commit_index, applied_index, snapshot_index, active_membership, committed_membership, replication, request_queue_depth, outbound_queue_depth, build_version, storage_schema_version, snapshot_format_version, peer_protocol_version]
      properties:
        cluster_id: { type: string, format: uuid }
        node_id: { type: integer, format: uint64, minimum: 1 }
        role: { type: string, enum: [follower, pre_candidate, candidate, leader] }
        term: { type: integer, format: uint64, minimum: 0 }
        leader_id: { type: [integer, 'null'], format: uint64, minimum: 1 }
        leadership_transfer_target_id: { type: [integer, 'null'], format: uint64, minimum: 1 }
        commit_index: { type: integer, format: uint64, minimum: 0 }
        applied_index: { type: integer, format: uint64, minimum: 0 }
        snapshot_index: { type: integer, format: uint64, minimum: 0 }
        active_membership: { $ref: '#/components/schemas/Configuration' }
        committed_membership: { $ref: '#/components/schemas/Configuration' }
        replication: { type: array, items: { $ref: '#/components/schemas/ReplicationProgress' } }
        request_queue_depth: { type: integer, minimum: 0 }
        outbound_queue_depth: { type: integer, minimum: 0 }
        build_version: { type: string }
        storage_schema_version: { type: integer, minimum: 1 }
        snapshot_format_version: { type: integer, minimum: 1 }
        peer_protocol_version: { type: integer, minimum: 1 }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        request_id: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid operational bearer token
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    MembershipConflict:
      description: Operation ID conflict or another change is in progress
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    LeadershipTransferBusy:
      description: Leader is not at a safe boundary or another operation is active
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    LeadershipTransferTimeout:
      description: Target did not establish leadership before the bounded deadline
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InvalidRequest:
      description: Invalid syntax, key, identity, sequence, or conditional headers
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    KeyNotFound:
      description: Key absent at the linearization point
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    SequenceConflict:
      description: Stale, skipped, or conflicting request sequence
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionFailed:
      description: Committed resource precondition evaluated false
      headers:
        Raft-KV-Revision:
          $ref: '#/components/headers/Revision'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionRequired:
      description: Required conditional request header missing
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValueTooLarge:
      description: Value exceeds the configured maximum
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UnsupportedMediaType:
      description: Body is not application/octet-stream
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unavailable:
      description: No usable leader, overload, or client-record capacity reached
      headers:
        Retry-After: { schema: { type: integer, minimum: 0 } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
