[service]
name = "raft-kv-service"

[server]
host = "0.0.0.0"
port = 8080
request_timeout_seconds = 30
operational_token = "local-development-only"

[telemetry]
log_filter = "raft_kv_service=debug,tower_http=info"
log_format = "pretty"

[raft]
cluster_id = "00000000-0000-0000-0000-000000000001"
node_id = 1
voters = [1]
peer_endpoints = []
data_file = "data/node-1.sqlite3"
request_queue_capacity = 256
outbound_queue_capacity = 1024
election_timeout_min_ms = 300
election_timeout_max_ms = 600
heartbeat_interval_ms = 100
rpc_timeout_ms = 250
max_clients = 10000
snapshot_threshold_entries = 10000
staging = false

[peer]
host = "0.0.0.0"
port = 9080
advertised_url = "http://127.0.0.1:9080"
