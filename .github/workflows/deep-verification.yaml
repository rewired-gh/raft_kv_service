name: Deep verification

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  formal-matrix:
    name: Extended model matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make formal-container
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: formal-matrix-${{ github.sha }}
          path: target/formal-container
          retention-days: 30

  coverage:
    name: Branch coverage with process faults
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-24
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: make coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: |
            target/coverage.json
            target/coverage-campaigns
          retention-days: 30

  fuzz:
    name: Fuzz seed ${{ matrix.seed }} / ${{ matrix.nodes }} nodes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 737373
            nodes: 3
          - seed: 919191
            nodes: 3
          - seed: 929292
            nodes: 5
          - seed: 104729
            nodes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --locked --bins
      - run: ./target/debug/raft-kv-fuzz --seed ${{ matrix.seed }} --operations 12 --cluster-size ${{ matrix.nodes }} --artifact-dir target/fuzz/campaign
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuzz-${{ matrix.seed }}-${{ matrix.nodes }}-${{ github.sha }}
          path: target/fuzz/campaign
          retention-days: 30

  mutation:
    name: Mutation shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0/4, 1/4, 2/4, 3/4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: cargo mutants --workspace --file 'src/raft/*.rs' --file 'src/storage/*.rs' --all-features --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-${{ strategy.job-index }}-${{ github.sha }}
          path: mutants.out
          retention-days: 30
